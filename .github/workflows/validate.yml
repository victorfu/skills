name: Validate packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported (CONTRIBUTING.md) and the version used for development.
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tools -p "test_*.py" -v
  # Loads the generated Claude package with the real CLI; needs no sign-in.
  claude-install:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner context is not available in job-level env, so set it from a step.
      - run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate dist/claude --strict
      - run: claude plugin validate .claude-plugin/marketplace.json --strict
      - run: claude plugin marketplace add ./
      - run: claude plugin install devflow@victorfu-skills --scope user
      - run: claude plugin list | grep -F "devflow@victorfu-skills"

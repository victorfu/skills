interface:
  display_name: "Address Review Feedback"
  short_description: "Verify feedback, fix issues, update PRs and reply"
  default_prompt: "Use $devflow:address-review-feedback to verify the review feedback, fix valid issues, check merge conflicts and builds, commit and push to the existing PR, and reply to review comments unless I explicitly limit the scope."
policy:
  allow_implicit_invocation: false
